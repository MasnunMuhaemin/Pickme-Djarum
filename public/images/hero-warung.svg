<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 520" preserveAspectRatio="xMidYMin slice" role="img" aria-labelledby="t">
  <title id="t">Suasana warung sore hari dengan papan slot hadiah PICKME di dinding</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e3a8"/>
      <stop offset="0.45" stop-color="#c9995a"/>
      <stop offset="0.8" stop-color="#5c3d1d"/>
      <stop offset="1" stop-color="#2b1d0c"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.62" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" r="0.5">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset="0.35" stop-color="#ffe9a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5e2f"/>
      <stop offset="1" stop-color="#5a3a18"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="galon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe0ef" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#e6f4fa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9ccbe0" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b1d0c" flood-opacity="0.35"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- Dinding papan kayu, memenuhi seluruh gambar -->
  <rect width="430" height="520" fill="url(#wall)"/>
  <g stroke="#6b4a26" stroke-opacity="0.18" stroke-width="2">
    <path d="M54 0v520M118 0v520M182 0v520M246 0v520M310 0v520M374 0v520"/>
  </g>
  <rect width="430" height="520" fill="url(#warm)"/>

  <!-- Lampu gantung -->
  <path d="M-10 26 Q 110 70 215 44 T 440 30" fill="none" stroke="#3a2612" stroke-width="2" stroke-opacity="0.6"/>
  <g>
    <circle cx="30" cy="40" r="18" fill="url(#bulb)"/><circle cx="30" cy="40" r="4" fill="#fffbe8"/>
    <circle cx="96" cy="54" r="18" fill="url(#bulb)"/><circle cx="96" cy="54" r="4" fill="#fffbe8"/>
    <circle cx="160" cy="54" r="18" fill="url(#bulb)"/><circle cx="160" cy="54" r="4" fill="#fffbe8"/>
    <circle cx="226" cy="43" r="18" fill="url(#bulb)"/><circle cx="226" cy="43" r="4" fill="#fffbe8"/>
    <circle cx="292" cy="36" r="18" fill="url(#bulb)"/><circle cx="292" cy="36" r="4" fill="#fffbe8"/>
    <circle cx="358" cy="33" r="18" fill="url(#bulb)"/><circle cx="358" cy="33" r="4" fill="#fffbe8"/>
    <circle cx="420" cy="31" r="18" fill="url(#bulb)"/><circle cx="420" cy="31" r="4" fill="#fffbe8"/>
  </g>

  <!-- Rak kiri: toples dan kotak tanpa merek -->
  <g filter="url(#soft)">
    <!-- rak atas -->
    <g transform="translate(-6 104)">
      <rect x="22" y="12" width="40" height="52" rx="10" fill="#e9b949" opacity="0.9"/>
      <rect x="22" y="12" width="40" height="52" rx="10" fill="url(#glass)"/>
      <rect x="26" y="4" width="32" height="12" rx="4" fill="#a9d65b"/>
      <rect x="70" y="20" width="36" height="44" rx="9" fill="#d97b4a" opacity="0.85"/>
      <rect x="70" y="20" width="36" height="44" rx="9" fill="url(#glass)"/>
      <rect x="74" y="12" width="28" height="11" rx="4" fill="#f7f3e3"/>
      <rect x="114" y="8" width="26" height="56" rx="5" fill="#f7f3e3"/>
      <rect x="114" y="22" width="26" height="12" fill="#a9d65b"/>
      <rect x="146" y="26" width="30" height="38" rx="5" fill="#1b3a1a" opacity="0.85"/>
      <rect x="0" y="64" width="190" height="10" rx="3" fill="url(#shelf)"/>
    </g>
    <!-- rak bawah -->
    <g transform="translate(-6 196)">
      <rect x="18" y="0" width="46" height="70" rx="12" fill="url(#galon)"/>
      <rect x="31" y="-10" width="20" height="14" rx="4" fill="#5aa1c2"/>
      <rect x="72" y="22" width="34" height="48" rx="9" fill="#a9d65b" opacity="0.85"/>
      <rect x="72" y="22" width="34" height="48" rx="9" fill="url(#glass)"/>
      <rect x="76" y="14" width="26" height="11" rx="4" fill="#1b3a1a"/>
      <rect x="114" y="30" width="30" height="40" rx="6" fill="#e9b949" opacity="0.9"/>
      <rect x="150" y="18" width="28" height="52" rx="6" fill="#f7f3e3"/>
      <circle cx="164" cy="44" r="8" fill="#d97b4a" opacity="0.8"/>
      <rect x="0" y="70" width="190" height="10" rx="3" fill="url(#shelf)"/>
    </g>
  </g>

  <!-- Papan slot PICKME tergantung di dinding -->
  <path d="M290 64 L262 96 M290 64 L370 96" stroke="#3a2612" stroke-width="2" stroke-opacity="0.7" fill="none"/>
  <circle cx="290" cy="64" r="4" fill="#3a2612"/>
  <g transform="translate(212 92) rotate(4)" filter="url(#soft)">
    <rect width="196" height="214" rx="18" fill="#f7f3e3"/>
    <path d="M0 18a18 18 0 0 1 18-18h160a18 18 0 0 1 18 18v20H0z" fill="#1b3a1a"/>
    <text x="16" y="25" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#a9d65b" letter-spacing="1.5">PICKME · W07</text>
    <g transform="translate(160 7)">
      <rect width="24" height="24" rx="3" fill="#f7f3e3"/>
      <g fill="#1b3a1a">
        <rect x="2" y="2" width="8" height="8"/><rect x="14" y="2" width="8" height="8"/><rect x="2" y="14" width="8" height="8"/>
        <rect x="14" y="14" width="3" height="3"/><rect x="19" y="19" width="3" height="3"/><rect x="14" y="19" width="3" height="3"/>
      </g>
    </g>
    <g transform="translate(14 50)">
      <g fill="#ece4c4">
        <rect x="0" y="0" width="30" height="26" rx="8"/><rect x="34" y="0" width="30" height="26" rx="8"/><rect x="102" y="0" width="30" height="26" rx="8"/>
        <rect x="34" y="31" width="30" height="26" rx="8"/><rect x="68" y="31" width="30" height="26" rx="8"/><rect x="136" y="31" width="30" height="26" rx="8"/>
        <rect x="0" y="62" width="30" height="26" rx="8"/><rect x="34" y="62" width="30" height="26" rx="8"/><rect x="102" y="62" width="30" height="26" rx="8"/>
        <rect x="0" y="93" width="30" height="26" rx="8"/><rect x="68" y="93" width="30" height="26" rx="8"/><rect x="102" y="93" width="30" height="26" rx="8"/><rect x="136" y="93" width="30" height="26" rx="8"/>
        <rect x="34" y="124" width="30" height="26" rx="8"/><rect x="68" y="124" width="30" height="26" rx="8"/><rect x="136" y="124" width="30" height="26" rx="8"/>
      </g>
      <g fill="#1b3a1a">
        <rect x="68" y="0" width="30" height="26" rx="8"/><rect x="136" y="0" width="30" height="26" rx="8"/>
        <rect x="0" y="31" width="30" height="26" rx="8"/><rect x="102" y="31" width="30" height="26" rx="8"/>
        <rect x="136" y="62" width="30" height="26" rx="8"/>
        <rect x="34" y="93" width="30" height="26" rx="8"/>
        <rect x="0" y="124" width="30" height="26" rx="8"/><rect x="102" y="124" width="30" height="26" rx="8"/>
      </g>
      <g fill="none" stroke="#a9d65b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M76 13l5 5 9-9"/><path d="M144 13l5 5 9-9"/>
        <path d="M8 44l5 5 9-9"/><path d="M110 44l5 5 9-9"/>
        <path d="M144 75l5 5 9-9"/>
        <path d="M42 106l5 5 9-9"/>
        <path d="M8 137l5 5 9-9"/><path d="M110 137l5 5 9-9"/>
      </g>
      <!-- Slot yang ditunjuk sistem -->
      <rect x="64" y="58" width="38" height="34" rx="11" fill="#a9d65b" opacity="0.35" filter="url(#blur)"/>
      <rect x="68" y="62" width="30" height="26" rx="8" fill="#a9d65b" stroke="#1b3a1a" stroke-width="2.2"/>
      <text x="83" y="79" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#1b3a1a">C3</text>
    </g>
  </g>

  <!-- Hadiah melayang -->
  <g transform="translate(196 92)" filter="url(#soft)">
    <circle r="24" fill="#a9d65b"/>
    <g fill="none" stroke="#1b3a1a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-12" y="-5" width="24" height="17" rx="2"/>
      <path d="M-14 -5h28v-6h-28z"/>
      <path d="M0 -11v23"/>
      <path d="M0 -11c-3-7-11-7-9 0M0 -11c3-7 11-7 9 0"/>
    </g>
  </g>

  <!-- Meja warung di bawah (akan tertutup gradasi teks) -->
  <rect x="0" y="330" width="430" height="14" fill="#a9773f" opacity="0.8"/>
  <rect x="0" y="344" width="430" height="176" fill="#4a3016"/>
</svg>
